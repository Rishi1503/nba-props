[project]
name = "nbaprops"
version = "0.1.0"
description = "NBA player prop pricing model: data pipeline, simulation, pricing engine, and API"
requires-python = ">=3.12"
# Core = what the data pipeline needs (kept small so scheduled jobs install fast).
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "nba_api>=1.4",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
model = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "statsmodels>=0.14",
    "pyarrow>=15",
]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nbaprops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests that need a running Postgres (skipped if unreachable)"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
