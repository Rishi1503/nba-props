name: Production cycle (odds, settlement, projections, pricing)

# Triggered from outside by cron-job.org through workflow_dispatch: GitHub's own scheduler
# dropped most evening runs (4 of ~28 on Oct 27). Private repositories get 2,000 free minutes
# a month and every job bills at least one, so the outside schedule (New York time) is:
#   9:05 daily: command "daily" (players, schedule, stats, settlement)
#   10:00 and 15:00: the pricing runs
#   :00 and :30, 5 PM-11:30 PM: 6 PM pricing, late news, pre-tip passes, closing lines
#     (captured within 35 minutes of tip-off, so every 30 minutes keeps them)
#   :00 and :30, 11 AM-4:30 PM, Saturdays and Sundays: weekend afternoon games
# To fall back to GitHub's scheduler, restore these under "on:":
#   schedule:
#     - cron: "0 14,15,19,20 * * *"
#     - cron: "20,50 15-20 * * *"
#     - cron: "*/15 21-23 * * *"
#     - cron: "*/15 0-3 * * *"
#     - cron: "5 13 * * *"
on:
  workflow_dispatch:
    inputs:
      command:
        description: "cycle | daily | settle | status | tick | snapshot | injuries | schedule | seed | stats-day"
        default: "cycle"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      site_changed: ${{ steps.site.outputs.changed }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      # alerts (set one): a Discord webhook, or a Telegram bot token + chat id
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # the bankroll page (infra/pages): skipped until these secrets exist
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'nba-props-paper' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (pipeline + models)
        run: uv sync --locked --extra model
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"
            case "$CMD" in
              cycle|settle|status) uv run python -m nbaprops.ops.run "$CMD" ;;
              daily) # the 9:05 AM job, for an external scheduler (GitHub's drops runs)
                uv run python -m nbaprops.pipeline.run seed
                uv run python -m nbaprops.pipeline.run schedule
                uv run python -m nbaprops.pipeline.run stats-day || echo "::warning::stats-day failed from GitHub; run it locally"
                uv run python -m nbaprops.ops.run settle ;;
              tick|snapshot|injuries|schedule|seed|stats-day) uv run python -m nbaprops.pipeline.run "$CMD" ;;
              *) echo "bad command"; exit 1 ;;
            esac
          elif [ "${{ github.event.schedule }}" = "5 13 * * *" ]; then
            uv run python -m nbaprops.pipeline.run seed
            uv run python -m nbaprops.pipeline.run schedule
            # The stats site often blocks cloud IPs. Try anyway: if this step fails, run
            # `make stats-day` from your own machine each morning instead.
            uv run python -m nbaprops.pipeline.run stats-day || echo "::warning::stats-day failed from GitHub; run it locally"
            uv run python -m nbaprops.ops.run settle
          else
            uv run python -m nbaprops.ops.run cycle
          fi
      - name: Keep raw responses
        # only while the repository is private: a public repo's artifacts are downloadable
        if: always() && hashFiles('data/raw/**') != '' && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
      - name: Alert on a crash
        # Python alerts on its own failures; this covers crashes before it can (install, DB).
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="Production job failed before it could alert: $RUN_URL"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" "$DISCORD_WEBHOOK_URL"
          elif [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d text="$MSG"
          fi
      - name: Publish the bankroll page
        if: always() && env.CLOUDFLARE_API_TOKEN != ''
        run: bash infra/pages/publish.sh || echo "::warning::bankroll page not published"
      - name: Build the bankroll page (GitHub Pages)
        id: site
        if: always() && !github.event.repository.private
        run: |
          if ! uv run python -m nbaprops.site.build --out site/dist; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "::warning::bankroll page not built"; exit 0
          fi
          live=$(curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/hash.txt" 2>/dev/null || true)
          if [ "$(cat site/dist/hash.txt)" = "$live" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "bankroll page unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the bankroll page
        if: always() && steps.site.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # Deploys the page only when its data changed (new picks, results or verdict).
  pages:
    needs: collect
    if: always() && needs.collect.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
