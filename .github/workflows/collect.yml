name: Production cycle (odds, settlement, projections, pricing)

# GitHub bills every job as at least one minute, and private repositories get 2,000 free
# minutes a month, so the schedule only runs when there is something to do. The code decides
# what to do from New York time, so none of this needs editing when the clocks change.
#   14:00, 15:00, 19:00, 20:00 UTC  the 10 AM and 3 PM pricing runs (EDT and EST)
#   :20 and :50, 15-20 UTC          noon and afternoon games: closing lines (35-min window)
#   every 15 min, 21:00-03:45 UTC   the evening: 6 PM pricing, late news, most tip-offs
# (A public repository has unlimited minutes: then "*/15 14-23" and "*/15 0-3" is simplest.)
on:
  schedule:
    - cron: "0 14,15,19,20 * * *"
    - cron: "20,50 15-20 * * *"
    - cron: "*/15 21-23 * * *"
    - cron: "*/15 0-3 * * *"
    - cron: "5 13 * * *" # daily schedule + roster refresh, 9:05 AM EDT / 8:05 AM EST
  workflow_dispatch:
    inputs:
      command:
        description: "cycle | daily | settle | status | tick | snapshot | injuries | schedule | seed | stats-day"
        default: "cycle"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      # alerts (set one): a Discord webhook, or a Telegram bot token + chat id
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # the bankroll page (infra/pages): skipped until these secrets exist
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'nba-props-paper' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (pipeline + models)
        run: uv sync --locked --extra model
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"
            case "$CMD" in
              cycle|settle|status) uv run python -m nbaprops.ops.run "$CMD" ;;
              daily) # the 9:05 AM job, for an external scheduler (GitHub's drops runs)
                uv run python -m nbaprops.pipeline.run seed
                uv run python -m nbaprops.pipeline.run schedule
                uv run python -m nbaprops.pipeline.run stats-day || echo "::warning::stats-day failed from GitHub; run it locally"
                uv run python -m nbaprops.ops.run settle ;;
              tick|snapshot|injuries|schedule|seed|stats-day) uv run python -m nbaprops.pipeline.run "$CMD" ;;
              *) echo "bad command"; exit 1 ;;
            esac
          elif [ "${{ github.event.schedule }}" = "5 13 * * *" ]; then
            uv run python -m nbaprops.pipeline.run seed
            uv run python -m nbaprops.pipeline.run schedule
            # The stats site often blocks cloud IPs. Try anyway: if this step fails, run
            # `make stats-day` from your own machine each morning instead.
            uv run python -m nbaprops.pipeline.run stats-day || echo "::warning::stats-day failed from GitHub; run it locally"
            uv run python -m nbaprops.ops.run settle
          else
            uv run python -m nbaprops.ops.run cycle
          fi
      - name: Keep raw responses
        if: always() && hashFiles('data/raw/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
      - name: Alert on a crash
        # Python alerts on its own failures; this covers crashes before it can (install, DB).
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="Production job failed before it could alert: $RUN_URL"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" "$DISCORD_WEBHOOK_URL"
          elif [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d text="$MSG"
          fi
      - name: Publish the bankroll page
        if: always() && env.CLOUDFLARE_API_TOKEN != ''
        run: bash infra/pages/publish.sh || echo "::warning::bankroll page not published"
