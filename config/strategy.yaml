# Single source of truth for every tunable number in the strategy.
# A copy is stored with each model run. Change values here, never in code.
model_weight: 0.30              # weight on model vs the consensus no-vig in the fair-probability blend
min_consensus_books: 2          # FanDuel/Bovada/Unibet quoting DraftKings' line needed for a consensus
ev_min: 0.03                    # minimum EV to flag any pick
ev_min_model_only: 0.05         # minimum EV when there's no consensus
model_only_shrink: 0.50         # pull model prob this far toward DK implied when no consensus
hc_prob_min: 0.70               # high-confidence mode probability floor
# Sanity cap: a pick whose EV is above this is held back (logged, never staked or used as a
# parlay leg). Disagreeing with the market by that much usually means the model is missing
# news (a role change, a minutes limit), not that DraftKings is wrong.
max_edge: 0.15
# Milestone (alt-line "N+") rungs are flagged only where the model's probability lies in
# this band: the range the 2024-25 tail check validated. Further-out rungs are priced from
# the model's far tail alone (it overstated longshots: "45+ points" parlay legs at +118%).
milestone_p_min: 0.20
milestone_p_max: 0.92
kelly_fraction: 0.25            # quarter Kelly
max_bet_pct: 0.02               # cap per single, fraction of bankroll
max_parlay_pct: 0.01            # cap per satellite parlay
max_satellites_per_slate: 2
max_game_pct: 0.04              # total exposure per game
max_daily_pct: 0.10             # total exposure per day; stakes scale down proportionally above this
sgp_ev_haircut: 0.03            # EV subtracted from same-game parlays
n_sims: 10000
new_team_low_conf_games: 10
lineup_poll_start_min: 45
# Chance a player listed Questionable plays. Neutral starting value: replace it with the rate
# measured from logged reports and box scores (`python -m nbaprops.pipeline.run play-rates`).
p_play_questionable: 0.50
# Don't price a game whose DraftKings odds are older than this (plan: freshness check), and
# drop a consensus book that hasn't answered within it.
max_odds_age_min: 120
# Approved strategy: the core singles are high-confidence picks. Standard flags (EV >= 3% but
# below hc_prob_min) are still logged, at zero stake, so their CLV and hit rate are tracked;
# set true to stake them too.
stake_standard_flags: false
# Teammates of a key Questionable player (projected as a blend of "he plays" / "he sits"):
#   robust  - flag only if the bet is +EV in BOTH outcomes (and the blend clears ev_min)
#   mixture - judge the blend alone
#   block   - never flag them (the most conservative; costs the most volume)
questionable_teammates: robust
# After go-live: real stakes at ramp_factor x the engine's for the first ramp_bets real bets,
# then full stakes if real-money CLV holds (plan, Stage 9).
ramp_bets: 200
ramp_factor: 0.5
# Storage on free database tiers (~0.5 GB): the candidate log keeps main lines and milestones
# with EV at or above this (tuning needs props near the threshold, not far below it), plus
# anything flagged; and health checks alert at 80% of the database size limit.
candidate_log_min_ev: -0.05
db_size_limit_mb: 500
markets: [pts, reb, ast, fg3m, pra]
# Alt-line parlays, a paper experiment tracked on its own (parlay tier "alt_combo"): 2-3
# DraftKings "N+" rungs from different games, paying about -125 to +160. Legs only from the
# stats whose 55-95% probabilities passed the 2024-25 tail check, plus points and PRA, whose
# favored rungs the model underrates: priced with the alt-rung correction when
# rung_calibration exists (make backtest-rungs), conservatively without it. Assists get the
# over_shift correction below, like every pick. Each leg needs the model at
# alt_combo_p_min..milestone_p_max and an edge over the EV floor.
alt_combo_markets: [pts, reb, fg3m, ast, pra]
alt_combo_shade: {}
# Measured miscalibration, corrected for every pick: added to the model's chance of the over
# (the under moves the other way). 2024-25 tail check: assist overs came in about 1.0 point
# below prediction and assist unders about 1.2 above, on lines across each distribution.
over_shift: {ast: -0.012}
alt_combo_p_min: 0.65
alt_combo_decimal_min: 1.8
alt_combo_decimal_max: 2.6
alt_combo_max_legs: 3
max_alt_combos_per_slate: 2
# the alt-rung correction (written by make backtest-rungs; absent = no correction)
rung_calibration: config/rung_calibration.json
# Picks are recorded (and staked) only within this many minutes of tip-off: at the pre-tip
# pass, or a pricing run already that close. The 10 AM and 3 PM runs still price every game,
# but what they find is a watchlist (the candidate log), not a recorded pick: the record then
# judges picks made with the latest injury news and lineups, when real bets are placed.
# In effect from the evening of 2026-10-30; earlier picks were recorded whenever first
# flagged (the weekly review splits the two). 0 = any time.
record_window_min: 120
